# Publishes the website (site/, plus the deck as the "Try it" demo) to GitHub Pages:
# https://nodiecode.github.io/tablet-deck/
#
# Runs on pushes to main that change the site, the deck, the layouts or the images,
# and by hand from the Actions tab. scripts/build-site.js puts the site together.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "public/**"
      - "layouts/**"
      - "docs/*.jpg"
      - "docs/*.png"
      - "scripts/build-site.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Put the site together
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
